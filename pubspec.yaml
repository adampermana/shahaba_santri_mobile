
name: sahaba_mobile
description: Sahaba mobile application
version: 1.6.5+34
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.44.0

dependencies:
  alarm: ^5.5.0
  audioplayers: ^6.1.0
  camera: ^0.12.0+2
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.1.1
  dartz: ^0.10.1
  device_info_plus: ^12.4.0
  dio: ^5.10.0
  equatable: ^2.0.7
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_compass: ^0.8.0
  flutter_hooks: ^0.21.2
  flutter_html: ^3.0.0
  flutter_image_compress: ^2.5.0
  flutter_local_notifications: ^19.4.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_onboarding_slider:
    git:
      url: https://github.com/adampermana/flutter_onboarding_slider.git
      path: packages/flutter_onboarding_slider
      ref: sahaba
  flutter_spinkit: ^5.2.2
  flutter_streaming_text_markdown: ^1.9.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  geocoding: ^4.0.0
  geolocator: ^13.0.1
  get_it: ^9.2.1
  glass_kit: ^4.0.2
  go_router: ^17.3.0
  # google_sign_in: ^7.2.0
  # google_maps_flutter: ^2.12.3
  # google_mlkit_text_recognition: ^0.15.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  image_picker: ^1.2.3
  intl: ^0.20.2
  # isar_community: ^3.3.2
  # isar_community_flutter_libs: ^3.3.2
  json_annotation: ^4.9.0
  lottie: ^3.5.1
  marquee: ^2.3.0
  meta: ^1.18.0
  mime: ^2.0.0
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.15.0
  device_preview_plus: ^2.8.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  hive_ce_generator: ^1.11.2
  json_serializable: ^6.9.0
  mockito: ^5.6.4
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  assets:
    - assets/images/
    - assets/images/icon-apps/
    - assets/images/icon-images/
    - assets/images/splashscreen/
    - assets/images/jadwal_sholat/
    - assets/svg/
    - assets/animation/
    - assets/svg/motif/
    - assets/svg/notif/
    - assets/svg/qibla/
    - assets/svg/onboarding/
    - assets/svg/jadwal_sholat/
    - assets/audio/adzan-default.mp3

  fonts:
    - family: lpmq
      fonts:        
        - asset: assets/fonts/lpmq.otf
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
        - asset: assets/fonts/Satoshi-BlackItalic.otf
          weight: 900
          style: italic
