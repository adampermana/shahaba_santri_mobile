name: sahaba_mobile
description: Sahaba mobile application
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  bloc: ^9.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  intl: ^0.20.2

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf
        - asset: assets/fonts/amiri/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/amiri/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/amiri/Amiri-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Synonym
      fonts:
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Extralight.otf
          weight: 200
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Light.otf
          weight: 300
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Regular.otf
          weight: 400
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Medium.otf
          weight: 500
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Semibold.otf
          weight: 600
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Bold.otf
          weight: 700
