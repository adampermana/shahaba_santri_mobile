name: sahaba_mobile
description: Sahaba mobile application
version: 0.0.6+4
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  alarm: ^5.5.0
  audioplayers: ^6.1.0
  connectivity_plus: ^6.1.1
  dartz: ^0.10.1
  dio: ^5.10.0
  equatable: ^2.0.7
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_compass: ^0.8.0
  flutter_hooks: ^0.21.3+1
  flutter_local_notifications: ^19.4.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  geocoding: ^4.0.0
  geolocator: ^13.0.1
  get_it: ^9.2.1
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  meta: ^1.18.0
  path_provider: ^2.1.6
  permission_handler: ^11.3.1

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.15.0
  device_preview_plus: ^2.8.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  hive_ce_generator: ^1.11.2
  json_serializable: ^6.9.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icon-apps/
    - assets/images/splashscreen/
    - assets/svg/
    - assets/svg/motif/
    - assets/svg/notif/
    - assets/svg/qibla/
    - assets/svg/jadwal_sholat/
    - assets/svg/jadwal_sholat/isya/
    - assets/svg/jadwal_sholat/maghrib/
    - assets/svg/jadwal_sholat/subuh/
    - assets/svg/jadwal_sholat/terbit/
    - assets/audio/adzan-default.mp3

  fonts:
    - family: Markazi Text
      fonts:
        - asset: assets/fonts/Markazi/MarkaziText-Regular.ttf
          weight: 400
        - asset: assets/fonts/Markazi/MarkaziText-Medium.ttf
          weight: 500
        - asset: assets/fonts/Markazi/MarkaziText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Markazi/MarkaziText-Bold.ttf
          weight: 700
    - family: Synonym
      fonts:
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Extralight.otf
          weight: 200
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Light.otf
          weight: 300
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Regular.otf
          weight: 400
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Medium.otf
          weight: 500
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Semibold.otf
          weight: 600
        - asset: assets/fonts/synonym_complete/Fonts/OTF/Synonym-Bold.otf
          weight: 700
